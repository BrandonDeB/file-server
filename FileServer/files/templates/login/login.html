{% extends "login/loginmaster.html" %}

{% block title %}
   Login
{% endblock %}

{% block content %}
   {% if messages %}
      {% for message in messages %}
      {{ message }}
      {% endfor %}
   {% endif %}
   <h1>Login</h1>
   <form action="{% url 'files:login' %}" method="POST">
      {% csrf_token %}
      {{ form }}
      <input type="submit" value="Submit">
   </form>
   <a href="{% url 'files:register' %}" role="button"> Create an Account! </a>
{% endblock %}
