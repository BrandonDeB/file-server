{% extends "login/loginmaster.html" %}

{% block title %}
   Register
{% endblock%}

{% block content %}
   {% if messages %}
      {% for message in messages %}
      {{ message }}
      {% endfor %}
   {% endif %}
   <h1>Register</h1>
   <form action="{% url 'files:register'%}" method="POST">
      {% csrf_token %}
      {{ form }}
      <input type="submit" value="Submit">
   </form>
   <a href="{% url 'files:login' %}"> Already have an Account? Sign-in Now! </a>
{% endblock %}
